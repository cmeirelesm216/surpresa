<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo II - As Qualidades Reais</title>
  <style>
    body {
      background-color: #f5f0e6;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      color: #3e3e3e;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px;
      background-color: #ffffffcc;
      border-radius: 12px;
      margin-top: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      font-size: 2em;
      color: #556b2f;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    select {
      font-size: 1em;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #aaa;
      margin-bottom: 10px;
    }
    #submitBtn {
      margin-top: 20px;
      background-color: #6b8e23;
      color: white;
      padding: 10px 20px;
      font-size: 1.1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #submitBtn:hover {
      background-color: #556b2f;
    }
    #feedback {
      margin-top: 20px;
      font-weight: bold;
    }
    #nextBtn {
      display: none;
      margin-top: 30px;
      background-color: #3e5f1b;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Capítulo II – As Qualidades Reais</h2>
    <img src="carta2anacleto.jpg" alt="Carta do Anacleto" style="max-width: 200px; margin: 20px auto; display: block;" />
    <p>Liga as qualidades com quem achas que cada uma pertence.</p>

    <div class="grid">
      <div>
        <p>Bela</p>
        <select id="q1">
          <option value="">-- Escolhe --</option>
          <option value="plebe">Plebe</option>
          <option value="princesa">A tua princesa</option>
        </select>

        <p>Engraçada</p>
        <select id="q2">
          <option value="">-- Escolhe --</option>
          <option value="plebe">Plebe</option>
          <option value="princesa">A tua princesa</option>
        </select>

        <p>Loira</p>
        <select id="q3">
          <option value="">-- Escolhe --</option>
          <option value="plebe">Plebe</option>
          <option value="princesa">A tua princesa</option>
        </select>

        <p>Inteligente</p>
        <select id="q4">
          <option value="">-- Escolhe --</option>
          <option value="plebe">Plebe</option>
          <option value="princesa">A tua princesa</option>
        </select>

        <p>Carinhosa</p>
        <select id="q5">
          <option value="">-- Escolhe --</option>
          <option value="plebe">Plebe</option>
          <option value="princesa">A tua princesa</option>
        </select>
      </div>
    </div>

    <button id="submitBtn" onclick="verificar()">Confirmar Respostas</button>
    <p id="feedback"></p>
    <button id="nextBtn" onclick="location.href='pagina4.html'">Avançar para a próxima pista</button>
  </div>

  <script>
    function verificar() {
      const r1 = document.getElementById('q1').value;
      const r2 = document.getElementById('q2').value;
      const r3 = document.getElementById('q3').value;
      const r4 = document.getElementById('q4').value;
      const r5 = document.getElementById('q5').value;

      const correto = (r1 === 'princesa' && r2 === 'princesa' && r3 === 'plebe' && r4 === 'princesa' && r5 === 'princesa');
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('nextBtn');

      if (correto) {
        feedback.textContent = '🧩 Nada loiro nesta resposta! Ganhaste mais uma peça do puzzle.';
        feedback.style.color = '#3e5f1b';
        nextBtn.style.display = 'block';
      } else {
        feedback.textContent = 'Hmm... Algo aqui está pintado de loiro demais. Tenta outra vez!';
        feedback.style.color = '#a94442';
        nextBtn.style.display = 'none';
      }
    }
  </script>
</body>
</html>
